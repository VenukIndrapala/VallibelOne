<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vallibel One — Industry Exposure & Knowledge Sharing Programme</title>
    <meta
      name="description"
      content="Registration and information portal for Vallibel One PLC's Industry Exposure and Knowledge Sharing Programme."
    />

    <!-- React (production builds, no build step needed) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone: transforms JSX in the browser on page load.
         Pinned to the 7.x line — newer versions default to the "automatic"
         JSX runtime, which injects an `import` statement that fails outside
         a module bundler and silently renders a blank page. -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- type="text/babel" tells Babel Standalone to transform this file's JSX -->
    <script type="text/babel" src="app.js" data-presets="react"></script>
  </body>
</html>
